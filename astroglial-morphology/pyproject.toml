[project]
name = "astroglial-morphology"
version = "0.2.0"
description = ""
authors = [{ name = "Javid Rezai", email = "javid.af@outlook.com" }]
requires-python = ">=3.10,<3.11"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "scikit-image (>=0.24,<0.25)",
    "pillow (>=11.3.0,<12.0.0)",
    "ipykernel (>=6.30.1,<7.0.0)",
    "numpy (>=2.0.2,<3.0.0)",
    "matplotlib (>=3.9.4,<4.0.0)",
    "cellpose (>=3.1.1.2,<4.0.0.0)",
    "suite2p (==0.14.5)",
    "astroglial-analysis @ git+https://github.com/yaksilab/silver-dollop.git@v1.0.3",
    "readlif (>=0.6.6,<0.7.0)",
]

[dependency-groups]
test = [
    "pytest>=9.0.2,<10",
    "pytest-cov>=6.0.0,<7",
    "pytest-mock>=3.14.0,<4",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = ["src/astroglial_morphology"]

[tool.hatch.build.targets.wheel]
include = ["src/astroglial_morphology"]

[tool.hatch.build.targets.wheel.sources]
"src/astroglial_morphology" = "astroglial_morphology"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=astroglial_morphology",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src/astroglial_morphology"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
